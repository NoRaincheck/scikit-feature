[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "skfeature-chappers"
version = "1.1.3"
description = "Unofficial Fork of Feature Selection Repository in Python (DMML Lab@ASU)"
readme = "README.md"
keywords = ["Feature Selection Repository"]
authors = [
    { name = "Jundong Li", email = "jundong.li@asu.edu" },
    { name = "Kewei Cheng", email = "kcheng18@asu.edu" },
    { name = "Suhang Wang", email = "suhang.wang@asu.edu" },
]
maintainers = [
    { name = "HeardACat" },
]
requires-python = ">=3.9"
dependencies = [
    "scikit-learn",
    "pandas",
    "numpy",
]

[project.optional-dependencies]
ci = [
    "pytest",
    "pytest-cov",
]

[project.urls]
Homepage = "https://github.com/HeardACat/scikit-feature"

[tool.setuptools.packages.find]
include = ["skfeature*"]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "ruff>=0.15.14",
    "ty>=0.0.39",
]
docs = []

[tool.ruff]
line-length = 120
target-version = "py39"
exclude = [".git", "__pycache__", "dist", "build"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E203", "E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
