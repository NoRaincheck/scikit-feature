<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>scikit-feature - Feature Selection Repository</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Feature Selection Repository in Python (DMML Lab@ASU)" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0" />
  <!-- Docsify theme -->
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify/themes/vue.css" />
  <style>
    .app-name img { width: 32px; }
    /* Dark mode support */
    body[data-app-id="scikit-feature"] { --theme-color: #4a90d9; }
    .sidebar-toggle { bottom: 60px; }
  </style>
</head>
<body>
  <div id="app">Loading...</div>

  <script>
    window.$docsify = {
      name: 'scikit-feature',
      repo: 'https://github.com/NoRaincheck/scikit-feature',
      loadSidebar: true,
      alias: {},
      subMaxLevel: 3,
      search: 'auto',
      maxLevel: 4,
      coverpage: true,
      formatLoaded: function (markdown, next) {
        // Process markdown before rendering
        next(markdown);
      },
      plugins: [
        function (hook, vm) {
          hook.beforeEach(function (html) {
            var url = 'https://github.com/NoRaincheck/scikit-feature/blob/main/' + vm.route.file;
            var editHtml = '<a href="' + url + '" target="_blank" rel="noopener noreferrer">✏️ Edit on GitHub</a>\n';
            return editHtml + html;
          });
        }
      ]
    };
  </script>

  <!-- Docsify core -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <!-- Search plugin -->
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <!-- Copy code plugin -->
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code@2"></script>
  <!-- Emoji plugin -->
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/emoji.min.js"></script>
  <!-- External script loader (for loading .md as external files) -->
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/external-script.min.js"></script>
</body>
</html>
